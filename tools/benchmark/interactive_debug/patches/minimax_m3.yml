- id: llm-pi-ai
  config:
    providers:
      minimax-cn:
        apiKeyEnv: MINIMAX_CN_API_KEY
        models:
          - id: MiniMax-M3
            name: MiniMax-M3
          - id: MiniMax-M3.1-Flash
            name: MiniMax-M3.1-Flash
        baseURL: https://api.minimaxi.com/anthropic
        streamIdleTimeoutMs: 900000
        timeoutMs: 1800000
- id: agent-default-model
  config:
    provider: minimax-cn
    model: MiniMax-M3
