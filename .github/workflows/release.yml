name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Release gate (tests + version)
    runs-on: ubuntu-latest
    env:
      COLUMNS: "120"
      # Same help-rendering fallback as tests.yml: Rich on Ubuntu CI can emit
      # an empty options table in captured subprocess output.
      TYPER_USE_RICH: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y verilator
          fi
      - name: Install crapper (complexity gate)
        run: |
          git clone --depth 1 https://github.com/unclebob/crapper.git "$HOME/my_skills/vendor/crapper"
      - name: Tag/version consistency
        run: python3 tools/check_release_version.py
      - name: Canonical gates
        env:
          SVQ_GATE_BASE: HEAD~1
        run: bash tools/run_gates.sh

  build:
    name: Build and inspect distributions
    needs: release-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sv_query
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
