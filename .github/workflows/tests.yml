name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache pyslang
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pyslang-${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-pyslang-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # P171.1: pyslang 11.0.0 is on PyPI; do not install git HEAD
          # (CI previously downgraded to 7.0.1 and broke pyslang.ast imports).
          pip install -e ".[dev]"
          # P171.1: macOS runner; install verilator for oracle tests if absent.
          command -v verilator >/dev/null 2>&1 || brew install verilator

      - name: Install crapper (complexity gate)
        run: |
          git clone --depth 1 https://github.com/unclebob/crapper.git "$HOME/my_skills/vendor/crapper"

      - name: Run canonical gates
        env:
          SVQ_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: |
          bash tools/run_gates.sh

      - name: Build/install wheel smoke
        run: |
          rm -rf /tmp/svq-wheel /tmp/svq-install
          python -m pip wheel . --no-deps -w /tmp/svq-wheel
          python -m pip install --no-deps --target /tmp/svq-install /tmp/svq-wheel/*.whl
          test -d /tmp/svq-install/sv_query/trace
          test ! -e /tmp/svq-install/trace
          PYTHONPATH=/tmp/svq-install python - <<'PY'
          import sv_query.trace, trace
          assert "/tmp/svq-install/" in sv_query.trace.__file__
          assert "python" in trace.__file__.lower()
          PY
          PYTHONPATH=/tmp/svq-install /tmp/svq-install/bin/sv_query --help >/dev/null

      - name: Check discipline
        # 3 个纪律: 1) 不在 src/trace/core/ 用 regex
        #           2) 不导入 igraph / graphviz
        #           3) 目录深度 ≤ 3 (不含 __pycache__)
        # 包装在 test_discipline_enforced.py 里, 这里仅冗余跑
        run: |
          python .github/workflows/check_discipline.py

      - name: Run tests with coverage
        run: |
          python -m pytest sim/tests/ -m "not opensource" --cov=src --cov-report=term-missing --cov-report=xml

      - name: Report opensource suite (non-blocking, visible)
        continue-on-error: true
        run: |
          python -m pytest sim/tests/ -m "opensource" -q -p no:randomly | tee opensource.log

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Lint with ruff
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff (changed files only)
        env:
          SVQ_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: |
          bash tools/run_lint.sh
